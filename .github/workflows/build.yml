# Builds and tests Enactive on every push and pull request.
#
# This is the first place the build is verified by something other than one developer's machine.
# It runs on windows-latest because the app is a Windows desktop app and several tests exercise
# Windows-specific behaviour (directory junctions, cmd.exe) — a Linux runner would quietly skip
# exactly the cases most worth checking.
name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Matches Directory.Build.props (net10.0). A global.json, if one is added, wins over this.
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Enactive.sln

      - name: Build
        run: dotnet build Enactive.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/Enactive.Engine.Tests/Enactive.Engine.Tests.csproj --no-build --configuration Release --verbosity normal
