# Builds and tests Enactive on every push and pull request.
#
# This is the first place the build is verified by something other than one developer's machine.
# It runs on windows-latest because the app is a Windows desktop app and several tests exercise
# Windows-specific behaviour (directory junctions, cmd.exe) — a Linux runner would quietly skip
# exactly the cases most worth checking.
name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Matches Directory.Build.props (net10.0). A global.json, if one is added, wins over this.
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Enactive.sln

      - name: Build
        run: dotnet build Enactive.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/Enactive.Engine.Tests/Enactive.Engine.Tests.csproj --no-build --configuration Release --verbosity normal

  # The wiki's HTML is generated from Docs/wiki and COMMITTED, because the site is static files
  # served by GitHub Pages and nothing builds them on the way out. That arrangement has one failure
  # mode and it is silent: the generator breaks, or somebody edits the Markdown and forgets to
  # rebuild, and the site goes on serving the last good HTML. Nobody sees a thing.
  #
  # It had already happened. build-wiki.mjs read the web fonts from server/wwwroot, that directory
  # was removed when the real gateway replaced the prototype, and the build failed from then on -
  # discovered a month later, by running it.
  #
  # So: rebuild here and require the result to equal what was committed. This is a check on the
  # PAIR - the generator still runs, and the output in the repository is what it produces.
  #
  # ubuntu because the generated files must be byte-identical, and a checkout on Linux gives the
  # Markdown LF endings. The generator normalises what it reads for the same reason: it used to
  # leave a trailing \r in every line of the search index on a CRLF checkout, so a Windows build
  # and a Linux build of the same source disagreed, and this step would have been red on arrival
  # for a reason that had nothing to do with anybody's edit.
  wiki:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ci, not install: the lockfile is committed so that a different resolution of `marked`
      # cannot quietly change every generated page.
      - name: Install
        working-directory: web-site
        run: npm ci

      - name: Rebuild the wiki
        working-directory: web-site
        run: npm run build:wiki

      # Links, anchors, duplicate IDs, CSP-safe markup, and that every fenced example in the
      # Markdown survived into the HTML.
      - name: Check the wiki
        working-directory: web-site
        run: npm run check:wiki

      - name: The committed HTML is what the generator produces
        run: |
          if ! git diff --quiet -- web-site; then
            echo "::error::The committed wiki does not match a fresh build. Run 'npm run build:wiki' in web-site/ and commit the result."
            git --no-pager diff --stat -- web-site
            exit 1
          fi

  # The gateway's tests need a real MySQL, and they had never run anywhere but one developer's
  # machine - 59 tests about a schema, and CI could not say a word about any of them.
  #
  # Ubuntu, not the Windows runner above: GitHub's service containers only exist on Linux runners.
  # That costs nothing here because no project targets net10.0-windows - the Windows-specific
  # behaviour lives in the ENGINE tests, which stay on the Windows job for exactly that reason.
  gateway:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: enactive-dev
          MYSQL_DATABASE: enactive_remote
        ports:
          - "3306:3306"
        # A step that starts before the server is listening fails as "cannot connect", which reads
        # like a broken test rather than a slow container.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -penactive-dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Whether the server is the one the schema was written for is checked by the suite itself
      # (SchemaTests.The_server_is_the_series_this_schema_was_written_for) rather than by a step
      # here: a check in the pipeline only ever runs in the pipeline, and it would depend on a
      # mysql client being present on the runner image, which is not something this repository
      # gets to promise.
      - name: Test the gateway
        run: dotnet test tests/Enactive.Remote.Gateway.Tests/Enactive.Remote.Gateway.Tests.csproj --configuration Release --verbosity normal
        env:
          ENACTIVE_REMOTE_DB: "Server=127.0.0.1;Port=3306;User ID=root;Password=enactive-dev;Database=enactive_remote;"

      # Built here and PULLED from here: the server is on a private address, so nothing in this
      # pipeline can reach it. enactive-deploy.timer asks the API for the newest run of this
      # workflow with status=success and installs its artifact - unless that build carries a
      # migration, which it parks for a person instead. A migration is DDL, MySQL cannot roll it
      # back, and whoever would have to fix a half-applied schema should be watching when it is
      # applied. See Docs/REMOTE_OPERATIONS.md §4.
      #
      # This job's success is therefore load-bearing in a way it was not before: it is what the
      # server treats as permission to deploy. A step added after the publish that can fail keeps
      # that meaning; one that cannot fail quietly widens what "green" promises.
      #
      # linux-x64 because that is what the server is, and the tests above have just run on it.
      # Publishing from any other job would ship a build nothing had exercised.
      - name: Publish the gateway
        if: success()
        run: dotnet publish src/Enactive.Remote.Gateway/Enactive.Remote.Gateway.csproj --configuration Release --runtime linux-x64 --no-self-contained --output publish

      - name: Keep it
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # The commit is in the name because "which build is on the server" is the first question
          # of every incident, and a file called gateway.zip cannot answer it.
          name: gateway-${{ github.sha }}
          path: publish
          retention-days: 30
