name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The panel's tests, the gateway's and the panel in a browser - what build.yml's gateway job runs. The release
  # job needs it, so its success is what lets a release be made.
  gateway:
    uses: ./.github/workflows/gateway-tests.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  # The panel's fingerprints for the release notes: what a gateway built from this tag publishes at
  # /.well-known/enactive-panel.json, made from a publish for the server's platform. Its own job on
  # Linux because the release job below runs on Windows, whose checkout gives the panel's text files
  # CRLF endings - the same tag hashes differently there, and that list would match no server.
  panel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish the gateway
        run: dotnet publish src/Enactive.Remote.Gateway/Enactive.Remote.Gateway.csproj --configuration Release --runtime linux-x64 --no-self-contained --output publish

      - name: Fingerprint the panel
        run: bash deploy/panel-manifest.sh publish/wwwroot > panel-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: panel-manifest
          path: panel-manifest.json
          retention-days: 1

  release:
    permissions:
      contents: write
    needs: [gateway, panel]
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?(?:\+[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?\z') {
            throw "Tag '$tag' must look like v1.2.3"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Enactive.sln --runtime win-x64

      - name: Test
        run: dotnet test tests/Enactive.Engine.Tests/Enactive.Engine.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Publish Windows package
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          dotnet publish src/Enactive.App.Ui/Enactive.App.Ui.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=$env:VERSION `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            --output artifacts/enactive-win-x64

          if ($LASTEXITCODE -ne 0) { throw "UI publish failed" }

          dotnet publish src/Enactive.App.Console/Enactive.App.Console.csproj `
            --configuration Release --runtime win-x64 --self-contained true --no-restore `
            -p:Version=$env:VERSION -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None `
            --output artifacts/enactive-win-x64
          if ($LASTEXITCODE -ne 0) { throw "CLI publish failed" }
          if (!(Test-Path artifacts/enactive-win-x64/enactive-ui.exe) -or
              !(Test-Path artifacts/enactive-win-x64/enactive.exe)) { throw "Package is missing an executable" }
          & artifacts/enactive-win-x64/enactive.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Published CLI smoke test failed" }

          Compress-Archive `
            -Path artifacts/enactive-win-x64/* `
            -DestinationPath "artifacts/Enactive-$env:VERSION-win-x64.zip"

      - uses: actions/download-artifact@v4
        with:
          name: panel-manifest
          path: artifacts

      # Bash, which the Windows runner has: the list goes into the notes exactly as it was made, and
      # PowerShell's quoting of backticks and newlines is not a place to keep bytes that must compare.
      - name: Release notes
        shell: bash
        run: |
          {
            echo "## Panel fingerprints"
            echo
            echo "The SHA-256 of every script and stylesheet a gateway built from this release serves. Compare it with"
            echo "\`/.well-known/enactive-panel.json\` on a server that says it runs this release; the same list is attached"
            echo "as \`panel-manifest.json\` for \`cmp\`."
            echo
            echo '```json'
            cat artifacts/panel-manifest.json
            echo
            echo '```'
          } > artifacts/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Enactive ${{ steps.release.outputs.tag }}
          # Put before the generated notes, which are still added.
          body_path: artifacts/release-notes.md
          generate_release_notes: true
          files: |
            artifacts/Enactive-${{ steps.release.outputs.version }}-win-x64.zip
            artifacts/panel-manifest.json
